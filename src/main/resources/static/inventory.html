<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/styles.css">
    <meta charset="UTF-8">
    <title>NHBB</title>

<!--    Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
<!--    End Bootstrap-->
</head>
<body class="container mt-5">
    <h1 class="header">NHBB Inventory Management</h1>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Current Inventory</h2>
        <div id="inventoryTable"></div>
    </div>

    <div>
        <!-- Add new item to inventory   -->
        <form class="form-label">
            <h3>Add new item to inventory</h3>
            <label class="form-label" for="addItemInput">Item name:</label>
            <input  class="form-control" type="text" id="addItemInput" placeholder="Item"><br>
            <label class="form-label" for="addQuantityInput">Quantity:</label>
            <input  class="form-control" type="text" id="addQuantityInput" placeholder="Quantity"><br><br>
            <button class="btn btn-primary" type=button id="submitAddItem" style="font-size: 20px">Add</button>
        </form>
        <!-- Delete item from inventory   -->
        <form class="form-label">
            <h3>Delete item from inventory</h3>
            <label class="form-label" for="deleteItemInput">Item name:</label>
            <input  class="form-control" type="text" id="deleteItemInput" placeholder="Item"><br>
            <label class="form-label" for="deleteQuantityInput">Quantity:</label>
            <input  class="form-control" type="text" id="deleteQuantityInput" placeholder="Quantity"><br><br>
            <button class="btn btn-danger" type=button id="submitDeleteItem" style="font-size: 20px">Delete</button>
        </form>
    </div>

<script src="js/script.js"></script>
</body>
</html>
